<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: poppins, sans-serif;
}
body{
    background:#eef2f7;
}
.container{
    width:90%;
    margin:40px auto;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap:20px;
}
.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    transition:0.3s;
}
.card:hover{
    transform:translateY(-5px);
}
.card h2{
    margin-bottom:10px;
    color:#333;
}
.card p{
    color:#555;
    line-height:1.6;
}
.profile img{
    width:100px;
    height:100px;
    border-radius:50%;
    display:block;
    margin-bottom:10px;
}
.contact input, .contact textarea{
    width:100%;
    padding:8px;
    margin:6px 0;
    border:1px solid #ccc;
    border-radius:6px;
}
.contact button{
    background:#4a6cff;
    color:#fff;
    border:none;
    padding:10px;
    width:100%;
    border-radius:6px;
    cursor:pointer;
}
.contact button:hover{
    background:#324fd1;
}
</style>
</head>

<body>

<div class="container">

    <!-- Profile Card -->
    <div class="card profile">
        <img src="https://via.placeholder.com/100" alt="Profile">
        <h2>Profile</h2>
        <p><strong>Name:</strong> Nisha Jatav</p>
        <p><strong>Location:</strong> India</p>
    </div>

    <!-- Education Card -->
    <div class="card">
        <h2>Education</h2>
        <p>Bachelor of Computer Science</p>
        <p>Final Year Student</p>
        <p>2022 - 2026</p>
    </div>

    <!-- Profession Card -->
    <div class="card">
        <h2>Profession</h2>
        <p>Frontend Developer</p>
        <p>HTML, CSS, JavaScript</p>
        <p>Portfolio & Blogging Website</p>
    </div>

    <!-- Contact Card -->
    <div class="card contact">
        <h2>Contact</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="3" placeholder="Message"></textarea>
        <button>Send Message</button>
    </div>

</div>

</body>
</html>
